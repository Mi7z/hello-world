<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paintboard</title>
<style>
/* Hello-World-Grund-Design für Apps. Farben, Schrift und Rundungen kommen aus dem
   gewählten Design (design.klar, design.terminal …) – hier nur Ersatzwerte. */
:where(:root){color-scheme:light dark;--bg:#f6f5f2;--fl:#fff;--fl2:#f1efea;--li:#e6e3dc;--li2:#d3cfc6;--tx:#1d1c1a;--tx2:#5d5a55;--tx3:#918d86;--ak:#3b5bdb;--ak2:#e9eeff;--ak-tx:#fff;--rot:#d9480f;--gelb:#d68c00;--gruen:#2b8a3e;--r:16px;--r-klein:10px;--schrift:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--schrift-titel:var(--schrift);--mono:ui-monospace,Menlo,Consolas,monospace;--schatten:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 var(--schrift);padding:64px 16px 40px;max-width:760px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font:700 24px/1.2 var(--schrift-titel);margin:6px 0 6px;letter-spacing:-.01em}h2{font:650 18px/1.3 var(--schrift-titel);margin:18px 0 8px}
p.unter{color:var(--tx2);margin:0 0 20px}
.karte{background:var(--fl);border:1px solid var(--li);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--schatten)}
button,.knopf{font:600 15px/1 var(--schrift);border:1px solid var(--ak);border-radius:var(--r-klein);padding:12px 18px;min-height:46px;background:var(--ak);color:var(--ak-tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .05s}
button:hover,.knopf:hover{filter:brightness(1.07)}button:active,.knopf:active{transform:translateY(1px)}
button.zweit,.knopf.zweit{background:var(--fl2);color:var(--tx);border-color:var(--li)}
button:disabled{opacity:.45;cursor:default;filter:none}
input,select,textarea{font:16px/1.4 var(--schrift);color:var(--tx);background:var(--fl2);border:1px solid var(--li);border-radius:var(--r-klein);padding:11px 13px;min-height:46px;width:100%;caret-color:var(--ak)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ak);outline-offset:-1px;border-color:transparent}
input[type=range]{padding:0;min-height:32px;accent-color:var(--ak)}input[type=color]{padding:4px;min-height:46px}input[type=checkbox],input[type=radio]{width:auto;min-height:auto;accent-color:var(--ak)}
label{display:block;font-size:14px;color:var(--tx2);margin:12px 0 6px;font-weight:500}
.ablage{border:2px dashed var(--li2);border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--tx2);cursor:pointer;background:var(--fl)}
.ablage.drueber{border-color:var(--ak);background:var(--ak2);color:var(--tx)}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spalten{display:grid;gap:14px}
.reiter{display:flex;gap:4px;background:var(--fl2);border:1px solid var(--li);border-radius:var(--r-klein);padding:4px;margin-bottom:14px}
.reiter button{flex:1;background:none;color:var(--tx2);border:0;min-height:40px;font-weight:500}
.reiter button[aria-selected=true],.reiter button.an{background:var(--fl);color:var(--tx);box-shadow:var(--schatten);font-weight:650}
.hinweis{font-size:14px;color:var(--tx2)}.fehler{color:var(--rot)}
a{color:var(--ak)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ak);outline-offset:2px}
@media (min-width:900px){body{max-width:1120px;padding:32px 36px 48px}.spalten{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
/* App-spezifisch */
.werkzeug label{margin:0 0 2px}
.werkzeug .feld{display:flex;flex-direction:column;gap:2px}
.farbe-feld input[type=color]{width:56px;height:44px;padding:4px;cursor:pointer}
.staerke-feld{flex:1;min-width:150px}
.staerke-feld input[type=range]{min-height:auto;padding:0;background:none;border:0}
.aktiv{background:var(--ak);color:#fff}
#leinwandBox{position:relative;width:100%;background:var(--fl2);border:1px solid var(--li);border-radius:var(--r);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:auto;background:#ffffff;cursor:crosshair;touch-action:none}
.staerke-wert{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
@media (min-width:900px){.mal-layout{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-areas:"werkzeug flaeche" "aktionen flaeche";gap:0 16px;align-items:start}.mal-layout .werkzeug{grid-area:werkzeug}.mal-layout .aktionen{grid-area:aktionen}.mal-layout .flaeche{grid-area:flaeche}.mal-layout .aktionen .zeile,.mal-layout .werkzeug>.zeile{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<h1>🎨 Paintboard</h1>
<p class="unter">Male frei mit Maus oder Finger – Farbe, Pinselstärke, Radierer und Speichern als PNG. Alles bleibt in deinem Browser.</p>

<div class="mal-layout">
<div class="karte werkzeug">
  <div class="zeile">
    <div class="feld farbe-feld">
      <label for="farbe">Farbe</label>
      <input type="color" id="farbe" value="#1f8a5b" aria-label="Pinselfarbe wählen">
    </div>
    <div class="feld staerke-feld">
      <label for="staerke">Pinselstärke</label>
      <div class="zeile">
        <input type="range" id="staerke" min="1" max="60" value="8" aria-label="Pinselstärke">
        <span class="staerke-wert" id="staerkeWert">8&nbsp;px</span>
      </div>
    </div>
  </div>
  <div class="zeile" style="margin-top:12px">
    <button type="button" id="pinselBtn" class="aktiv">✏️ Pinsel</button>
    <button type="button" id="radierBtn" class="zweit">🧽 Radierer</button>
  </div>
</div>

<div class="karte flaeche">
  <div id="leinwandBox">
    <canvas id="leinwand" width="700" height="500" aria-label="Zeichenfläche"></canvas>
  </div>
</div>

<div class="karte aktionen">
  <div class="zeile">
    <button type="button" id="zurueckBtn" class="zweit" disabled>↩️ Zurück</button>
    <button type="button" id="wiederBtn" class="zweit" disabled>↪️ Wiederholen</button>
    <button type="button" id="loeschenBtn" class="zweit">🗑️ Alles löschen</button>
    <button type="button" id="speichernBtn">💾 Als PNG speichern</button>
  </div>
  <p class="hinweis" id="meldung" style="margin-top:12px">Tipp: Zeichne einfach los. Mit „Zurück“ machst du den letzten Strich rückgängig.</p>
</div>
</div>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById("leinwand");
  var ctx = canvas.getContext("2d");
  var farbe = document.getElementById("farbe");
  var staerke = document.getElementById("staerke");
  var staerkeWert = document.getElementById("staerkeWert");
  var pinselBtn = document.getElementById("pinselBtn");
  var radierBtn = document.getElementById("radierBtn");
  var zurueckBtn = document.getElementById("zurueckBtn");
  var wiederBtn = document.getElementById("wiederBtn");
  var loeschenBtn = document.getElementById("loeschenBtn");
  var speichernBtn = document.getElementById("speichernBtn");
  var meldung = document.getElementById("meldung");

  var zeichnet = false;
  var radiert = false;
  var letzteX = 0, letzteY = 0;
  var verlauf = [];   // Stapel vergangener Zustände
  var zukunft = [];   // Stapel für Wiederholen
  var MAX = 30;

  // Weißen Hintergrund setzen (für PNG ohne Transparenz)
  function hintergrund(){
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  hintergrund();

  function zustandSichern(){
    try{
      verlauf.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if(verlauf.length > MAX) verlauf.shift();
      zukunft = [];
      knoepfeAktualisieren();
    }catch(e){
      // Falls getImageData scheitert, ignorieren wir das Sichern still
    }
  }

  function knoepfeAktualisieren(){
    zurueckBtn.disabled = verlauf.length === 0;
    wiederBtn.disabled = zukunft.length === 0;
  }

  function sagen(text, fehler){
    meldung.textContent = text;
    meldung.className = fehler ? "hinweis fehler" : "hinweis";
  }

  // Bildschirmkoordinaten in Canvas-Koordinaten umrechnen
  function pos(ev){
    var rect = canvas.getBoundingClientRect();
    var x, y;
    if(ev.touches && ev.touches.length){
      x = ev.touches[0].clientX;
      y = ev.touches[0].clientY;
    } else {
      x = ev.clientX;
      y = ev.clientY;
    }
    return {
      x: (x - rect.left) * (canvas.width / rect.width),
      y: (y - rect.top) * (canvas.height / rect.height)
    };
  }

  function strichBreite(){
    return parseInt(staerke.value, 10);
  }

  function start(ev){
    ev.preventDefault();
    zustandSichern();
    zeichnet = true;
    var p = pos(ev);
    letzteX = p.x;
    letzteY = p.y;
    // Einzelner Punkt (Klick/Tipp ohne Bewegung)
    ctx.beginPath();
    ctx.arc(p.x, p.y, strichBreite()/2, 0, Math.PI*2);
    ctx.fillStyle = radiert ? "#ffffff" : farbe.value;
    ctx.fill();
  }

  function malen(ev){
    if(!zeichnet) return;
    ev.preventDefault();
    var p = pos(ev);
    ctx.beginPath();
    ctx.moveTo(letzteX, letzteY);
    ctx.lineTo(p.x, p.y);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = strichBreite();
    ctx.strokeStyle = radiert ? "#ffffff" : farbe.value;
    ctx.stroke();
    letzteX = p.x;
    letzteY = p.y;
  }

  function ende(){
    if(zeichnet){
      zeichnet = false;
      sagen(radiert ? "Radiert." : "Strich gezeichnet.", false);
    }
  }

  // Maus
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", malen);
  window.addEventListener("mouseup", ende);
  canvas.addEventListener("mouseleave", ende);

  // Touch
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", malen, {passive:false});
  canvas.addEventListener("touchend", ende);
  canvas.addEventListener("touchcancel", ende);

  // Werkzeuge
  function pinselWaehlen(){
    radiert = false;
    pinselBtn.classList.add("aktiv");
    pinselBtn.classList.remove("zweit");
    radierBtn.classList.add("zweit");
    radierBtn.classList.remove("aktiv");
    canvas.style.cursor = "crosshair";
  }
  function radiererWaehlen(){
    radiert = true;
    radierBtn.classList.add("aktiv");
    radierBtn.classList.remove("zweit");
    pinselBtn.classList.add("zweit");
    pinselBtn.classList.remove("aktiv");
    canvas.style.cursor = "cell";
  }
  pinselBtn.addEventListener("click", pinselWaehlen);
  radierBtn.addEventListener("click", radiererWaehlen);

  staerke.addEventListener("input", function(){
    staerkeWert.innerHTML = strichBreite() + "&nbsp;px";
  });

  zurueckBtn.addEventListener("click", function(){
    if(verlauf.length === 0) return;
    zukunft.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    var bild = verlauf.pop();
    ctx.putImageData(bild, 0, 0);
    knoepfeAktualisieren();
    sagen("Letzter Schritt rückgängig gemacht.", false);
  });

  wiederBtn.addEventListener("click", function(){
    if(zukunft.length === 0) return;
    verlauf.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    var bild = zukunft.pop();
    ctx.putImageData(bild, 0, 0);
    knoepfeAktualisieren();
    sagen("Schritt wiederhergestellt.", false);
  });

  loeschenBtn.addEventListener("click", function(){
    zustandSichern();
    hintergrund();
    sagen("Zeichenfläche geleert.", false);
  });

  speichernBtn.addEventListener("click", function(){
    try{
      canvas.toBlob(function(blob){
        if(!blob){
          sagen("Das Bild konnte leider nicht erstellt werden.", true);
          return;
        }
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        var d = new Date();
        var name = "mal-brett-" +
          d.getFullYear() + "-" +
          String(d.getMonth()+1).padStart(2,"0") + "-" +
          String(d.getDate()).padStart(2,"0") + ".png";
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        sagen("Bild als „" + name + "“ gespeichert.", false);
      }, "image/png");
    }catch(e){
      sagen("Beim Speichern ist ein Fehler aufgetreten.", true);
    }
  });

  knoepfeAktualisieren();
})();
</script>
</body>
</html>
