<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einkaufsliste sortieren</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="application/json" id="hw-ki">
{
  "zweck": "Freien Einkaufszettel-Text in eine nach Supermarkt-Abteilungen sortierte Artikelliste verwandeln.",
  "aufgaben": {
    "sortieren": {
      "anweisung": "Du bekommst den Einkaufszettel eines Nutzers als freien Text. Die Artikel können durch Kommas, Zeilenumbrüche, Aufzählungszeichen oder Mengenangaben getrennt sein (z. B. '2 Liter Milch, Brot, 500g Hackfleisch'). Zerlege den Text in einzelne Artikel. Behalte Mengenangaben im Namen, wenn vorhanden. Ordne jeden Artikel genau einer der festen Abteilungen zu: 'Obst & Gemüse' (frisches Obst, Gemüse, Salate, Kräuter), 'Backwaren' (Brot, Brötchen, Kuchen), 'Molkerei & Eier' (Milch, Käse, Joghurt, Butter, Eier), 'Fleisch & Wurst' (frisches Fleisch, Wurst, Aufschnitt), 'Tiefkühl' (alles Gefrorene, Eis, Pizza), 'Konserven & Trockenwaren' (Nudeln, Reis, Mehl, Dosen, Gewürze, Snacks, Süßigkeiten), 'Getränke' (Wasser, Saft, Limo, Bier, Wein, Kaffee, Tee), 'Drogerie' (Zahnpasta, Shampoo, Kosmetik, Medikamente), 'Haushalt' (Putzmittel, Spülmittel, Toilettenpapier, Batterien) und 'Sonstiges' (alles, was sonst nirgends passt). Wähle immer die am besten passende Abteilung. Doppelte Artikel nur einmal aufnehmen. Gib keine leeren Namen zurück.",
      "schema": {
        "type": "object",
        "properties": {
          "artikel": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "name": { "type": "string" },
                "abteilung": { "type": "string", "enum": ["Obst & Gemüse","Backwaren","Molkerei & Eier","Fleisch & Wurst","Tiefkühl","Konserven & Trockenwaren","Getränke","Drogerie","Haushalt","Sonstiges"] }
              },
              "required": ["name","abteilung"]
            }
          }
        },
        "required": ["artikel"]
      }
    }
  }
}
</script>
<style>
:where(:root){color-scheme:light dark;--bg:#f6f5f2;--fl:#fff;--fl2:#f1efea;--li:#e6e3dc;--li2:#d3cfc6;--tx:#1d1c1a;--tx2:#5d5a55;--tx3:#918d86;--ak:#3b5bdb;--ak2:#e9eeff;--ak-tx:#fff;--rot:#d9480f;--gelb:#d68c00;--gruen:#2b8a3e;--r:16px;--r-klein:10px;--schrift:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--schrift-titel:var(--schrift);--mono:ui-monospace,Menlo,Consolas,monospace;--schatten:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 var(--schrift);padding:64px 16px 40px;max-width:760px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font:700 24px/1.2 var(--schrift-titel);margin:6px 0 6px;letter-spacing:-.01em}h2{font:650 18px/1.3 var(--schrift-titel);margin:18px 0 8px}
p.unter{color:var(--tx2);margin:0 0 20px}
.karte{background:var(--fl);border:1px solid var(--li);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--schatten)}
button,.knopf{font:600 15px/1 var(--schrift);border:1px solid var(--ak);border-radius:var(--r-klein);padding:12px 18px;min-height:46px;background:var(--ak);color:var(--ak-tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .05s}
button:hover,.knopf:hover{filter:brightness(1.07)}button:active,.knopf:active{transform:translateY(1px)}
button.zweit,.knopf.zweit{background:var(--fl2);color:var(--tx);border-color:var(--li)}
button:disabled{opacity:.45;cursor:default;filter:none}
input,select,textarea{font:16px/1.4 var(--schrift);color:var(--tx);background:var(--fl2);border:1px solid var(--li);border-radius:var(--r-klein);padding:11px 13px;min-height:46px;width:100%;caret-color:var(--ak)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ak);outline-offset:-1px;border-color:transparent}
input[type=range]{padding:0;min-height:32px;accent-color:var(--ak)}input[type=color]{padding:4px;min-height:46px}input[type=checkbox],input[type=radio]{width:auto;min-height:auto;accent-color:var(--ak)}
label{display:block;font-size:14px;color:var(--tx2);margin:12px 0 6px;font-weight:500}
.ablage{border:2px dashed var(--li2);border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--tx2);cursor:pointer;background:var(--fl)}
.ablage.drueber{border-color:var(--ak);background:var(--ak2);color:var(--tx)}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spalten{display:grid;gap:14px}
.reiter{display:flex;gap:4px;background:var(--fl2);border:1px solid var(--li);border-radius:var(--r-klein);padding:4px;margin-bottom:14px}
.reiter button{flex:1;background:none;color:var(--tx2);border:0;min-height:40px;font-weight:500}
.reiter button[aria-selected=true],.reiter button.an{background:var(--fl);color:var(--tx);box-shadow:var(--schatten);font-weight:650}
.hinweis{font-size:14px;color:var(--tx2)}.fehler{color:var(--rot)}
a{color:var(--ak)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ak);outline-offset:2px}
@media (min-width:900px){body{max-width:1120px;padding:32px 36px 48px}.spalten{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}

/* App-spezifisch, nur Bausteine */
textarea#eingabe{min-height:180px;resize:vertical}
.abt-titel{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.abt-anzahl{font-size:13px;color:var(--tx3);font-weight:500}
ul.artikel{list-style:none;margin:0;padding:0}
ul.artikel li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--li)}
ul.artikel li:first-child{border-top:0}
ul.artikel li input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}
ul.artikel li label{margin:0;color:var(--tx);font-size:16px;flex:1;cursor:pointer}
ul.artikel li.erledigt label{text-decoration:line-through;color:var(--tx3)}
.loeschen{min-height:auto;padding:6px 10px;font-size:13px;border-color:var(--li);background:var(--fl2);color:var(--tx2)}
.leer-hinweis{color:var(--tx2);text-align:center;padding:12px 0}
.denkt{color:var(--ak);font-weight:600}
.fortschritt{font-size:13px;color:var(--tx2);margin-top:10px}
</style>
</head>
<body>
<h1>🛒 Einkaufsliste sortieren</h1>
<p class="unter">Schreib deinen Einkaufszettel als freien Text – deine KI sortiert alles nach Supermarkt-Abteilungen zum Abhaken. Alles bleibt in deinem Browser.</p>

<div class="spalten">
  <div>
    <div class="karte">
      <h2>Dein Zettel</h2>
      <label for="eingabe">Ein Artikel pro Zeile oder durch Komma getrennt</label>
      <textarea id="eingabe" placeholder="z. B.&#10;2 Liter Milch&#10;Brot, Bananen, Käse&#10;Spülmittel&#10;Hackfleisch, Tiefkühlpizza"></textarea>
      <div class="zeile" style="margin-top:12px">
        <button id="btnSortieren">Sortieren lassen</button>
        <button id="btnAnhaengen" class="zweit" hidden>Zur Liste hinzufügen</button>
      </div>
      <p id="status" class="hinweis" aria-live="polite"></p>
      <p id="fehler" class="fehler" hidden></p>
    </div>
  </div>

  <div>
    <div class="karte">
      <div class="zeile" style="justify-content:space-between">
        <h2 style="margin:0">Deine Liste</h2>
        <span id="zaehler" class="abt-anzahl"></span>
      </div>
      <div id="liste" style="margin-top:12px"></div>
      <div class="zeile" style="margin-top:14px" id="aktionen" hidden>
        <button id="btnErledigt" class="zweit">Erledigte entfernen</button>
        <button id="btnLeeren" class="zweit">Alles leeren</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var REIHENFOLGE = ["Obst & Gemüse","Backwaren","Molkerei & Eier","Fleisch & Wurst","Tiefkühl","Konserven & Trockenwaren","Getränke","Drogerie","Haushalt","Sonstiges"];
  var SPEICHER = "app.grocerysorter.liste";

  var eingabe = document.getElementById("eingabe");
  var btnSortieren = document.getElementById("btnSortieren");
  var btnAnhaengen = document.getElementById("btnAnhaengen");
  var status = document.getElementById("status");
  var fehler = document.getElementById("fehler");
  var listeEl = document.getElementById("liste");
  var zaehler = document.getElementById("zaehler");
  var aktionen = document.getElementById("aktionen");
  var btnErledigt = document.getElementById("btnErledigt");
  var btnLeeren = document.getElementById("btnLeeren");

  var liste = laden();
  var naechsteId = 1;
  liste.forEach(function(a){ if(a.id>=naechsteId) naechsteId=a.id+1; });

  function laden(){
    try{
      var roh = localStorage.getItem(SPEICHER);
      if(!roh) return [];
      var d = JSON.parse(roh);
      return Array.isArray(d) ? d : [];
    }catch(e){ return []; }
  }
  function speichern(){
    try{ localStorage.setItem(SPEICHER, JSON.stringify(liste)); }catch(e){}
  }

  function zeigeFehler(txt){
    fehler.textContent = txt;
    fehler.hidden = !txt;
  }

  function rendern(){
    listeEl.innerHTML = "";
    if(liste.length === 0){
      var p = document.createElement("p");
      p.className = "leer-hinweis";
      p.textContent = "Noch keine Artikel. Schreib links deinen Zettel und lass ihn sortieren.";
      listeEl.appendChild(p);
      aktionen.hidden = true;
      zaehler.textContent = "";
      return;
    }
    aktionen.hidden = false;

    var gruppen = {};
    liste.forEach(function(a){
      var abt = REIHENFOLGE.indexOf(a.abteilung) >= 0 ? a.abteilung : "Sonstiges";
      (gruppen[abt] = gruppen[abt] || []).push(a);
    });

    var offen = liste.filter(function(a){return !a.erledigt;}).length;
    zaehler.textContent = offen + " offen · " + liste.length + " gesamt";

    REIHENFOLGE.forEach(function(abt){
      var items = gruppen[abt];
      if(!items || items.length===0) return;
      var karte = document.createElement("div");
      karte.style.marginBottom = "18px";

      var titel = document.createElement("div");
      titel.className = "abt-titel";
      var h = document.createElement("strong");
      h.textContent = abt;
      var anz = document.createElement("span");
      anz.className = "abt-anzahl";
      anz.textContent = "(" + items.length + ")";
      titel.appendChild(h);
      titel.appendChild(anz);
      karte.appendChild(titel);

      var ul = document.createElement("ul");
      ul.className = "artikel";
      items.forEach(function(a){
        var li = document.createElement("li");
        if(a.erledigt) li.className = "erledigt";

        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!a.erledigt;
        cb.id = "art" + a.id;
        cb.addEventListener("change", function(){
          a.erledigt = cb.checked;
          speichern();
          rendern();
        });

        var lab = document.createElement("label");
        lab.htmlFor = "art" + a.id;
        lab.textContent = a.name;

        var del = document.createElement("button");
        del.className = "loeschen";
        del.type = "button";
        del.textContent = "✕";
        del.setAttribute("aria-label","Artikel entfernen");
        del.addEventListener("click", function(){
          liste = liste.filter(function(x){return x.id !== a.id;});
          speichern();
          rendern();
        });

        li.appendChild(cb);
        li.appendChild(lab);
        li.appendChild(del);
        ul.appendChild(li);
      });
      karte.appendChild(ul);
      listeEl.appendChild(karte);
    });
  }

  function artikelHinzu(neue){
    neue.forEach(function(n){
      var name = (n.name||"").trim();
      if(!name) return;
      var abt = REIHENFOLGE.indexOf(n.abteilung) >= 0 ? n.abteilung : "Sonstiges";
      var vorhanden = liste.some(function(a){
        return a.name.toLowerCase() === name.toLowerCase() && a.abteilung === abt;
      });
      if(vorhanden) return;
      liste.push({ id: naechsteId++, name: name, abteilung: abt, erledigt: false });
    });
    speichern();
    rendern();
  }

  async function sortieren(anhaengen){
    zeigeFehler("");
    var text = eingabe.value.trim();
    if(!text){
      zeigeFehler("Bitte schreib zuerst ein paar Artikel in das Textfeld.");
      return;
    }
    btnSortieren.disabled = true;
    btnAnhaengen.disabled = true;
    status.innerHTML = '<span class="denkt">Deine KI denkt nach …</span>';
    try{
      var antwort = await helloworld.ki("sortieren", { text: text });
      var artikel = (antwort && antwort.artikel) ? antwort.artikel : [];
      if(!Array.isArray(artikel) || artikel.length === 0){
        zeigeFehler("Ich konnte keine Artikel erkennen. Versuch es mit klaren Namen, z. B. „Milch, Brot, Äpfel“.");
        status.textContent = "";
        return;
      }
      if(!anhaengen){
        liste = [];
        naechsteId = 1;
      }
      artikelHinzu(artikel);
      eingabe.value = "";
      status.textContent = artikel.length + " Artikel sortiert.";
    }catch(err){
      status.textContent = "";
      zeigeFehler(err && err.message ? err.message : "Es gab ein Problem. Bitte versuch es noch einmal.");
    }finally{
      btnSortieren.disabled = false;
      btnAnhaengen.disabled = false;
    }
  }

  btnSortieren.addEventListener("click", function(){ sortieren(false); });
  btnAnhaengen.addEventListener("click", function(){ sortieren(true); });

  btnErledigt.addEventListener("click", function(){
    liste = liste.filter(function(a){return !a.erledigt;});
    speichern();
    rendern();
  });

  btnLeeren.addEventListener("click", function(){
    if(liste.length === 0) return;
    liste = [];
    speichern();
    rendern();
  });

  function eingabeStatus(){
    btnAnhaengen.hidden = liste.length === 0;
  }
  var alterRendern = rendern;
  rendern = function(){ alterRendern(); eingabeStatus(); };

  rendern();
})();
</script>
</body>
</html>
