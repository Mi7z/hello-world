<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Textkit</title>
<style>
/* Hello-World-Grund-Design für Apps. Farben, Schrift und Rundungen kommen aus dem
   gewählten Design (design.klar, design.terminal …) – hier nur Ersatzwerte. */
:where(:root){color-scheme:light dark;--bg:#f6f5f2;--fl:#fff;--fl2:#f1efea;--li:#e6e3dc;--li2:#d3cfc6;--tx:#1d1c1a;--tx2:#5d5a55;--tx3:#918d86;--ak:#3b5bdb;--ak2:#e9eeff;--ak-tx:#fff;--rot:#d9480f;--gelb:#d68c00;--gruen:#2b8a3e;--r:16px;--r-klein:10px;--schrift:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--schrift-titel:var(--schrift);--mono:ui-monospace,Menlo,Consolas,monospace;--schatten:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 var(--schrift);padding:64px 16px 40px;max-width:760px;margin:0 auto;-webkit-font-smoothing:antialiased}
h1{font:700 24px/1.2 var(--schrift-titel);margin:6px 0 6px;letter-spacing:-.01em}h2{font:650 18px/1.3 var(--schrift-titel);margin:18px 0 8px}
p.unter{color:var(--tx2);margin:0 0 20px}
.karte{background:var(--fl);border:1px solid var(--li);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--schatten)}
button,.knopf{font:600 15px/1 var(--schrift);border:1px solid var(--ak);border-radius:var(--r-klein);padding:12px 18px;min-height:46px;background:var(--ak);color:var(--ak-tx);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .05s}
button:hover,.knopf:hover{filter:brightness(1.07)}button:active,.knopf:active{transform:translateY(1px)}
button.zweit,.knopf.zweit{background:var(--fl2);color:var(--tx);border-color:var(--li)}
button:disabled{opacity:.45;cursor:default;filter:none}
input,select,textarea{font:16px/1.4 var(--schrift);color:var(--tx);background:var(--fl2);border:1px solid var(--li);border-radius:var(--r-klein);padding:11px 13px;min-height:46px;width:100%;caret-color:var(--ak)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ak);outline-offset:-1px;border-color:transparent}
input[type=range]{padding:0;min-height:32px;accent-color:var(--ak)}input[type=color]{padding:4px;min-height:46px}input[type=checkbox],input[type=radio]{width:auto;min-height:auto;accent-color:var(--ak)}
label{display:block;font-size:14px;color:var(--tx2);margin:12px 0 6px;font-weight:500}
.ablage{border:2px dashed var(--li2);border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--tx2);cursor:pointer;background:var(--fl)}
.ablage.drueber{border-color:var(--ak);background:var(--ak2);color:var(--tx)}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spalten{display:grid;gap:14px}
.reiter{display:flex;gap:4px;background:var(--fl2);border:1px solid var(--li);border-radius:var(--r-klein);padding:4px;margin-bottom:14px}
.reiter button{flex:1;background:none;color:var(--tx2);border:0;min-height:40px;font-weight:500}
.reiter button[aria-selected=true],.reiter button.an{background:var(--fl);color:var(--tx);box-shadow:var(--schatten);font-weight:650}
.hinweis{font-size:14px;color:var(--tx2)}.fehler{color:var(--rot)}
a{color:var(--ak)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ak);outline-offset:2px}
@media (min-width:900px){body{max-width:1120px;padding:32px 36px 48px}.spalten{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.reiter{display:flex;gap:8px;margin-bottom:12px}
.reiter button{background:var(--fl2);color:var(--tx);border:1px solid var(--li);font-weight:600}
.reiter button[aria-selected="true"]{background:var(--ak);color:var(--ak-tx);border-color:var(--ak)}
.werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.wert{background:var(--fl);border:1px solid var(--li);border-radius:var(--r);padding:12px}
.wert b{font-size:24px;display:block}.wert span{font-size:13px;color:var(--tx2)}
.mini{font-size:14px;padding:8px 14px}
</style>
</head>
<body>
<h1>📝 Textkit</h1>
<p class="unter">Text zählen und die Groß-/Kleinschreibung umwandeln – alles im Browser, nichts verlässt dein Gerät.</p>

<div class="spalten"><div>
<div class="karte"><textarea id="text" rows="8" style="min-height:40vh" placeholder="Text hier einfügen oder schreiben …"></textarea></div>
</div><div>

<div class="reiter" role="tablist">
  <button id="rb-zaehlen" role="tab" aria-selected="true" aria-controls="tab-zaehlen">Zählen</button>
  <button id="rb-umwandeln" role="tab" aria-selected="false" aria-controls="tab-umwandeln">Umwandeln</button>
</div>

<div id="tab-zaehlen" role="tabpanel" aria-labelledby="rb-zaehlen">
  <div class="werte" id="werte"></div>
</div>

<div id="tab-umwandeln" role="tabpanel" aria-labelledby="rb-umwandeln" hidden>
  <div class="karte">
    <div class="zeile">
      <button class="mini" data-modus="gross">GROSSBUCHSTABEN</button>
      <button class="mini" data-modus="klein">kleinbuchstaben</button>
      <button class="mini" data-modus="satz">Satzanfänge groß</button>
      <button class="mini" data-modus="wort">Jedes Wort groß</button>
    </div>
    <label for="aus">Ergebnis</label>
    <textarea id="aus" rows="6" readonly placeholder="Wähle oben eine Umwandlung …"></textarea>
    <div class="zeile" style="margin-top:10px">
      <button id="kopieren" class="zweit mini">Kopieren</button>
      <button id="uebernehmen" class="zweit mini">In den Text übernehmen</button>
      <span class="hinweis" id="meldung"></span>
    </div>
  </div>
</div>
</div></div>

<script>
const $ = (id) => document.getElementById(id);

function zaehlen() {
  const t = $('text').value;
  const woerter = (t.match(/[\p{L}\p{N}'’-]+/gu) || []).length;
  const saetze = (t.match(/[^.!?…]+[.!?…]+/g) || []).length || (t.trim() ? 1 : 0);
  const absaetze = t.split(/\n\s*\n/).filter((x) => x.trim()).length;
  const min = woerter / 200;
  const werte = [
    [t.length, 'Zeichen'], [t.replace(/\s/g, '').length, 'Zeichen ohne Leerzeichen'], [woerter, 'Wörter'],
    [saetze, 'Sätze'], [absaetze, 'Absätze'], [min < 1 ? (woerter ? '< 1 Min.' : '0 Min.') : Math.round(min) + ' Min.', 'Lesezeit'],
  ];
  $('werte').innerHTML = werte.map(([w, n]) => `<div class="wert"><b>${w}</b><span>${n}</span></div>`).join('');
}

// Umwandlungen der Groß-/Kleinschreibung
const umwandeln = {
  gross: (t) => t.toUpperCase(),
  klein: (t) => t.toLowerCase(),
  satz: (t) => t.toLowerCase().replace(/(^|[.!?…]+[\s"'»«(]*)(\p{L})/gu, (m, vor, buch) => vor + buch.toUpperCase()),
  wort: (t) => t.toLowerCase().replace(/\p{L}[\p{L}'’-]*/gu, (w) => w[0].toUpperCase() + w.slice(1)),
};

let letzterModus = null;
function anwenden(modus) {
  letzterModus = modus;
  $('aus').value = umwandeln[modus]($('text').value);
  $('meldung').textContent = '';
}

function melden(text) {
  $('meldung').textContent = text;
  setTimeout(() => { if ($('meldung').textContent === text) $('meldung').textContent = ''; }, 2500);
}

// Reiter umschalten
function reiter(name) {
  const zaehlenAktiv = name === 'zaehlen';
  $('rb-zaehlen').setAttribute('aria-selected', String(zaehlenAktiv));
  $('rb-umwandeln').setAttribute('aria-selected', String(!zaehlenAktiv));
  $('tab-zaehlen').hidden = !zaehlenAktiv;
  $('tab-umwandeln').hidden = zaehlenAktiv;
}

$('rb-zaehlen').addEventListener('click', () => reiter('zaehlen'));
$('rb-umwandeln').addEventListener('click', () => reiter('umwandeln'));

document.querySelectorAll('[data-modus]').forEach((b) => b.addEventListener('click', () => anwenden(b.dataset.modus)));

$('text').addEventListener('input', () => {
  zaehlen();
  if (letzterModus && !$('tab-umwandeln').hidden) anwenden(letzterModus);
});

$('kopieren').addEventListener('click', async () => {
  const t = $('aus').value;
  if (!t) { melden('Noch kein Ergebnis.'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(t);
    else { $('aus').removeAttribute('readonly'); $('aus').select(); document.execCommand('copy'); $('aus').setAttribute('readonly', ''); }
    melden('Kopiert.');
  } catch (e) { melden('Kopieren nicht möglich – bitte von Hand markieren.'); }
});

$('uebernehmen').addEventListener('click', () => {
  if (!$('aus').value) { melden('Noch kein Ergebnis.'); return; }
  $('text').value = $('aus').value;
  zaehlen();
  melden('Übernommen.');
});

zaehlen();
</script>
</body>
</html>
