<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text zählen</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f4;--fl:#ffffff;--fl2:#efefea;--li:#dcdcd4;--tx:#16181d;--tx2:#585b63;--ak:#1f8a5b;--ak2:#e8f5ee;--rot:#d64545;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fl:#181b21;--fl2:#22262e;--li:#2f343d;--tx:#eef0f3;--tx2:#a3a8b3;--ak:#4fd18b;--ak2:#163024}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:720px;margin:0 auto}
h1{font-size:22px;margin:4px 0 4px}p.unter{color:var(--tx2);margin:0 0 16px}
.karte{background:var(--fl);border:1px solid var(--li);border-radius:var(--r);padding:16px;margin-bottom:12px}
button,.knopf{font:inherit;border:0;border-radius:999px;padding:10px 18px;min-height:44px;background:var(--ak);color:#fff;font-weight:600;cursor:pointer}
button.zweit{background:var(--fl2);color:var(--tx);border:1px solid var(--li)}button:disabled{opacity:.5}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--fl2);border:1px solid var(--li);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
label{display:block;font-size:14px;color:var(--tx2);margin:10px 0 4px}
.ablage{border:2px dashed var(--li);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--tx2);cursor:pointer}
.ablage.drueber{border-color:var(--ak);background:var(--ak2)}
.zeile{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hinweis{font-size:13px;color:var(--tx2)}.fehler{color:var(--rot)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ak);outline-offset:2px}
</style>
</head>
<body>
<h1>🔢 Text zählen</h1>
<p class="unter">Zeichen, Wörter, Sätze und Lesezeit – während du tippst.</p>
<div class="karte"><textarea id="text" rows="9" placeholder="Text hier einfügen oder schreiben …"></textarea></div>
<div class="werte" id="werte"></div>
<style>.werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.wert{background:var(--fl);border:1px solid var(--li);border-radius:var(--r);padding:12px}.wert b{font-size:24px;display:block}.wert span{font-size:13px;color:var(--tx2)}</style>
<script>
const $ = (id) => document.getElementById(id);
function zaehlen() {
  const t = $('text').value;
  const woerter = (t.match(/[\p{L}\p{N}'’-]+/gu) || []).length;
  const saetze = (t.match(/[^.!?…]+[.!?…]+/g) || []).length || (t.trim() ? 1 : 0);
  const absaetze = t.split(/\n\s*\n/).filter((x) => x.trim()).length;
  const min = woerter / 200;
  const werte = [
    [t.length, 'Zeichen'], [t.replace(/\s/g, '').length, 'Zeichen ohne Leerzeichen'], [woerter, 'Wörter'],
    [saetze, 'Sätze'], [absaetze, 'Absätze'], [min < 1 ? (woerter ? '< 1 Min.' : '0 Min.') : Math.round(min) + ' Min.', 'Lesezeit'],
  ];
  $('werte').innerHTML = werte.map(([w, n]) => `<div class="wert"><b>${w}</b><span>${n}</span></div>`).join('');
}
$('text').addEventListener('input', zaehlen); zaehlen();
</script>
</body>
</html>
