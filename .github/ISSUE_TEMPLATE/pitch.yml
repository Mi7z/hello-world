name: Pitch – Hello World weiterentwickeln
description: Schlage eine Änderung an Hello World selbst vor. Mit genug 👍 wird sie gebaut.
title: "Pitch: "
labels: ["pitch"]
body:
  - type: markdown
    attributes:
      value: |
        **So geht's:** Beschreibe, was an Hello World besser werden soll. Andere geben mit 👍 ihre Stimme – mit genug Stimmen baut eine KI die Änderung.
  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: Was soll sich ändern, warum, und wie ungefähr?
      placeholder: |
        ## Worum geht's
        ## Was ändert sich
        ## Umfang und Risiken
    validations:
      required: true
