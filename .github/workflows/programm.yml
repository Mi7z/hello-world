# Baut das Hello-World-Programm für Windows, Mac und Linux (kostenlos auf GitHub)
# und legt es als Download in eine Veröffentlichung („Release").
# Start: neuen Versions-Tag pushen (z. B. v0.1.0) oder von Hand unter „Actions".
name: Programm bauen
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # ohne Signatur-Zertifikat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bauwerkzeuge
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Programm bauen
        working-directory: desktop
        shell: bash
        run: sh bauen.sh --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: hello-world-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
  veroeffentlichen:
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dateien
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dateien/*
          body: |
            Hello World zum Herunterladen.
            - **Windows:** `.exe` herunterladen und starten. Windows warnt evtl. „unbekannter Herausgeber" → „Weitere Informationen" → „Trotzdem ausführen".
            - **Mac:** `.dmg` öffnen und Hello World in „Programme" ziehen. Beim ersten Start Rechtsklick → „Öffnen".
            - **Linux:** `.AppImage` herunterladen, ausführbar machen und starten.
            - **Android:** `HelloWorld-Android.apk` auf dem Handy herunterladen und öffnen (einmal „Installation aus dieser Quelle erlauben").
            - **iPhone & alle Handys:** Web-App https://mi7z.github.io/hello-world/ öffnen → Teilen → „Zum Home-Bildschirm".
