<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f6f5f2">
<title>Hello World</title>
<link rel="icon" href="/icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hello World">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<script src="/design.js"></script>
</head>
<body>

<!-- Arbeitsfläche: offene Apps als Tabs (jede in ihrem eigenen, abgeschotteten Rahmen) -->
<div class="hw-flaeche" id="flaeche" hidden></div>
<div id="vorschauBand" class="vorschau-band" hidden>Vorschau – im Hello-World-Fenster übernehmen oder verwerfen</div>

<!-- Skills, KI-Werkzeuge, Server-Apps: Infoseite -->
<div id="infoseite" hidden>
  <header class="kopf">
    <a href="/" class="logo"><span class="logo-zeichen" aria-hidden="true">hw</span><span>Hello World</span></a>
    <div class="kopf-rechts" data-nur-server><button type="button" class="konto" data-anmelde-knopf>Anmelden</button></div>
  </header>
  <main class="seite" style="max-width:820px">
    <a class="zurueck" href="/">Zurück</a>
    <div class="app-kopf">
      <h1 id="iTitel" class="hw-titel"></h1>
      <p id="iBeschreibung"></p>
      <p><span class="marke akzent" id="iSchild"></span></p>
    </div>
    <div class="meldung warn" id="iHinweis"></div>
    <ul class="funktionen" id="iFakten"></ul>
    <section class="flaeche text-inhalt" id="iText" style="margin-top:18px"></section>
  </main>
</div>

<dialog id="codeDialog" class="blatt" style="width:min(900px,calc(100% - 24px))">
  <form method="dialog">
    <h2 id="codeTitel">Code</h2>
    <pre class="code" id="code"></pre>
    <div class="knoepfe"><button type="submit">Schließen</button></div>
  </form>
</dialog>

<script src="/kern.js"></script>
<script>
// Adresse: /a/app.name[@v2] – ohne Server: app.html?e=app.name[@v2]
const startName = decodeURIComponent(new URLSearchParams(location.search).get('e') || location.pathname.split('/')[2] || '');
const TABS = 'hw-tabs';
let katalog = [];
const appCache = new Map();
let tabs = []; // { kennung, slug, version, art: 'app'|'vorschau', auftrag?, titel? } + Laufzeit: rahmen, app, baum
let aktiv = -1;

const tabsSpeichern = () => localStorage.setItem(TABS, JSON.stringify(tabs.filter((t) => t.art === 'app').map(({ kennung, slug, version }) => ({ kennung, slug, version }))));
const tabsLaden = () => { try { return JSON.parse(localStorage.getItem(TABS) || '[]'); } catch { return []; } };

async function appHolen(name) {
  const slug = String(name).split('@')[0];
  if (appCache.has(slug)) return appCache.get(slug);
  const r = await fetch(`/api/app/${encodeURIComponent(slug)}`);
  if (!r.ok) return null;
  const d = await r.json();
  const a = { ...d.app, ...(katalog.find((x) => x.slug === d.app.slug) || {}), readme: d.readme };
  appCache.set(slug, a); appCache.set(kennung(a), a);
  return a;
}
const istDesign = (a) => a?.typ === 'design';
const quelle = (t) => (istDesign(t.app)
  ? `/muster?design=${t.slug}${t.version ? `&version=${t.version}` : ''}`
  : `${t.version ? `/apps/${t.slug}/v/${t.version}/` : `/apps/${t.slug}/`}?design=${designName()}`);

// ---------- Tabs ----------
function tabZeigen(i) {
  if (!tabs[i]) return;
  aktiv = i;
  localStorage.setItem('hw-tab-aktiv', tabs[i].kennung + (tabs[i].version ? '@' + tabs[i].version : ''));
  for (const [j, t] of tabs.entries()) {
    if (j === i && !t.rahmen) {
      t.rahmen = document.createElement('iframe');
      t.rahmen.title = t.titel || t.kennung;
      t.rahmen.setAttribute('sandbox', 'allow-scripts allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox');
      $('flaeche').appendChild(t.rahmen);
      if (t.art === 'vorschau') rahmenSetzen(t.rahmen, `/api/bau/${t.auftrag}/vorschau?design=${designName()}&t=${Date.now()}`);
      else rahmenSetzen(t.rahmen, t.vorschau ? `/api/bau/${t.vorschau.id}/vorschau?design=${designName()}&t=${t.vorschau.aktualisiert}` : quelle(t));
    }
    if (t.rahmen) t.rahmen.hidden = j !== i;
  }
  const t = tabs[i];
  $('vorschauBand').hidden = !(t.vorschau || t.art === 'vorschau');
  document.title = `${t.titel || t.kennung} – Hello World`;
  if (!STATISCH && t.art === 'app') history.replaceState(null, '', `/a/${t.kennung}${t.version ? '@' + t.version : ''}`);
  window.hwChat?.aktualisieren();
  if (t.art === 'app' && !t.baum && !istDesign(t.app) && !STATISCH) api(`/api/stammbaum/${t.slug}`).then((b) => { t.baum = b; window.hwChat?.aktualisieren(); }).catch(() => {});
  if (t.art === 'app' && istDesign(t.app) && !t.baum) api(`/api/stammbaum/${t.slug}`).then((b) => { t.baum = b; window.hwChat?.aktualisieren(); }).catch(() => {});
}
async function oeffnen(name, opts = {}) {
  const [k, version] = String(name).split('@');
  const a = await appHolen(k);
  if (!a) return;
  if (!['browser', 'design'].includes(a.typ || 'browser')) { location.href = `/a/${kennung(a)}`; return; }
  let i = tabs.findIndex((t) => t.art === 'app' && t.slug === a.slug && (t.version || null) === (version || null));
  if (i < 0) { tabs.push({ art: 'app', kennung: kennung(a), slug: a.slug, version: version || null, app: a, titel: kennung(a) + (version ? '@' + version : '') }); i = tabs.length - 1; tabsSpeichern(); }
  else if (opts.neu && tabs[i].rahmen) { tabs[i].rahmen.remove(); tabs[i].rahmen = null; tabs[i].baum = null; appCache.delete(a.slug); tabs[i].app = await appHolen(a.slug) || a; }
  $('infoseite').hidden = true; $('flaeche').hidden = false;
  tabZeigen(i);
}
function tabZu(i) {
  const t = tabs[i];
  if (!t) return;
  t.rahmen?.remove();
  tabs.splice(i, 1);
  tabsSpeichern();
  if (!tabs.length) { location.href = '/'; return; }
  tabZeigen(Math.min(i, tabs.length - 1));
}

// ---------- Vorschau eines Umbaus in der offenen App ----------
function vorschau(a) {
  const t = tabs[aktiv];
  if (!t || t.art !== 'app') return;
  if (a && a.zielSlug !== t.slug) return;
  t.vorschau = a || null;
  if (t.rahmen) rahmenSetzen(t.rahmen, a ? `/api/bau/${a.id}/vorschau?design=${designName()}&t=${a.aktualisiert}` : `${quelle(t)}${quelle(t).includes('?') ? '&' : '?'}t=${Date.now()}`);
  $('vorschauBand').hidden = !a;
}
// Vorschau einer NEUEN App als eigener Tab
function vorschauOeffnen(a) {
  let i = tabs.findIndex((t) => t.art === 'vorschau' && t.auftrag === a.id);
  if (i < 0) { tabs.push({ art: 'vorschau', auftrag: a.id, kennung: `Vorschau ${a.titelAnzeige || ''}`.trim(), titel: `Vorschau: ${a.titelAnzeige || 'neue App'}`, app: { slug: '', typ: 'browser', symbol: '👀' } }); i = tabs.length - 1; }
  $('infoseite').hidden = true; $('flaeche').hidden = false;
  tabZeigen(i);
}
document.addEventListener('hw-auftrag', (ev) => {
  // Vorschau-Tab einer neuen App: nach Veröffentlichen/Verwerfen schließen
  const a = ev.detail;
  const i = tabs.findIndex((t) => t.art === 'vorschau' && t.auftrag === a.id);
  if (i >= 0 && ['fertig', 'verworfen'].includes(a.status)) tabZu(i);
  if (i >= 0 && a.status === 'vorschau' && tabs[i].rahmen) rahmenSetzen(tabs[i].rahmen, `/api/bau/${a.id}/vorschau?design=${designName()}&t=${a.aktualisiert}`);
});

// ---------- Bereich „aktuelle App" im Hello-World-Fenster ----------
function appBereich(el) {
  const t = tabs[aktiv];
  if (!t) { el.hidden = true; return; }
  if (t.art === 'vorschau') { el.innerHTML = `<div class="hw-app-kopf"><span class="symbol" aria-hidden="true">👀</span><div><b>${esc(t.titel)}</b><small>Noch nicht veröffentlicht – unten im Chat übernehmen oder verwerfen</small></div></div>`; return; }
  const a = t.app;
  const v = t.baum?.versionen?.find((x) => x.id === (t.version || t.baum.standard));
  const designs = katalog.filter((x) => x.typ === 'design');
  el.innerHTML = `<div class="hw-app-kopf">${symbolHtml(a)}<div><b>${esc(t.kennung)}${t.version ? '@' + t.version : ''}</b><small>${v ? `Version ${v.id.slice(1)} · ${esc(autorText(v.autor))} · ${sterneText(v.wertung)}` : esc(a.beschreibung || '').slice(0, 90)}</small></div></div>
    <div class="menu-links">
      ${t.baum ? `<a class="knopf zweit" href="/b/${t.kennung}">Versionen (${t.baum.versionen.length})</a>` : ''}
      ${istDesign(a) ? `<button type="button" class="${designName() === t.slug ? 'zweit' : ''}" id="hwDesignNutzen">${designName() === t.slug ? 'Ist dein Design ✓' : 'Design verwenden'}</button>` : ''}
      <button type="button" class="zweit" id="hwCode">Code</button>
      <button type="button" class="zweit" id="hwLink">Link</button>
      <details class="hw-aussehen"><summary>Aussehen</summary><div class="mini-designs">${designs.map((d) => { const f = d.farben?.[0] || {}; return `<button type="button" data-design="${d.slug}" aria-pressed="${d.slug === designName()}"><span class="tupfen" style="background:linear-gradient(135deg, ${esc(f.bg)} 50%, ${esc(f.ak)} 50%)"></span>${esc(d.slug)}</button>`; }).join('')}</div></details>
    </div>`;
  el.querySelector('#hwCode').onclick = async () => {
    const src = t.vorschau ? `/api/bau/${t.vorschau.id}/vorschau` : istDesign(a) ? `/api/design/${t.slug}${t.version ? '@' + t.version : ''}.css` : (STATISCH ? `/apps/${t.slug}/${t.version ? `versionen/${t.version}.html` : 'index.html'}` : quelle(t));
    $('codeTitel').textContent = istDesign(a) ? 'design.css' : 'index.html';
    $('code').textContent = await (await fetch(src)).text();
    $('codeDialog').showModal();
  };
  el.querySelector('#hwLink').onclick = async (ev) => {
    const link = `${location.origin}/a/${t.kennung}`;
    try { await navigator.clipboard.writeText(link); ev.target.textContent = 'Kopiert ✓'; } catch { prompt('Link:', link); }
  };
  el.querySelector('#hwDesignNutzen')?.addEventListener('click', () => { designWaehlen(t.slug + (t.version ? '@' + t.version : '')); window.hwChat?.aktualisieren(); });
  el.querySelector('.mini-designs').onclick = (ev) => {
    const b = ev.target.closest('[data-design]');
    if (!b) return;
    designWaehlen(b.dataset.design);
    // Apps mit dem neuen Design neu laden (Designs zeigen ihr eigenes Muster)
    for (const x of tabs) if (x.rahmen && x.art === 'app' && !istDesign(x.app) && !x.vorschau) rahmenSetzen(x.rahmen, quelle(x));
    window.hwChat?.aktualisieren();
  };
}

window.HW_SEITE = {
  kontext: () => { const t = tabs[aktiv]; return t && t.art === 'app' ? { slug: t.slug, kennung: t.kennung, version: t.version } : null; },
  tabs: () => tabs.map((t, i) => ({ kennung: t.kennung, name: t.titel || t.kennung, aktiv: i === aktiv, symbol: t.app ? symbolHtml(t.app) : '' })),
  tabWahl: (i) => { $('infoseite').hidden = true; $('flaeche').hidden = false; tabZeigen(i); },
  tabZu, oeffnen, vorschau, vorschauOeffnen, appBereich,
};

// ---------- Infoseite für Skills, KI-Werkzeuge, Server-Apps ----------
function infoseite(app) {
  $('infoseite').hidden = false; $('flaeche').hidden = true;
  document.title = `${kennung(app)} – Hello World`;
  $('iTitel').textContent = kennung(app);
  $('iBeschreibung').textContent = app.beschreibung;
  const s = app.server || {};
  if (app.typ === 'server') {
    $('iSchild').textContent = 'Server-App · läuft beim Betreiber';
    $('iHinweis').innerHTML = `Hello World betreibt keine Server. Wer diese App nutzen will, betreibt sie selbst – oder nutzt die Instanz eines Betreibers.${s.betreiber_url ? `<div class="knoepfe"><a class="knopf" href="${encodeURI(s.betreiber_url)}" target="_blank" rel="noopener">Beim Betreiber öffnen ↗</a></div>` : ''}`;
    $('iFakten').innerHTML = [['Start', s.start], ['Kosten (zahlt der Betreiber)', s.kosten]].filter(([, v]) => v).map(([k, v]) => `<li><span><b>${k}:</b> ${esc(v)}</span></li>`).join('');
  } else if (app.typ === 'skill') {
    $('iSchild').textContent = 'Skill für KIs';
    $('iHinweis').innerHTML = `Mit Hello World in deiner KI (Claude Code, Codex …) wird dieser Skill automatisch gefunden, sobald er passt – oder sag „nutze ${esc(kennung(app))}". Dauerhaft: „installiere ${esc(kennung(app))}".`;
  } else {
    $('iSchild').textContent = 'Werkzeug für KIs (MCP) · läuft auf deinem Rechner';
    $('iHinweis').textContent = 'Richte es nach der Anleitung unten in deiner KI ein. Es läuft auf deinem Rechner, Hello World betreibt nichts.';
    if (app.mcp) $('iFakten').innerHTML = `<li><span><b>Start:</b> <code>${esc([app.mcp.command, ...(app.mcp.args || [])].join(' '))}</code></span></li>`;
  }
  $('iText').innerHTML = markdown(String(app.readme || '').replace(/^---[\s\S]*?---\n/, ''));
}

// ---------- Brücke: Apps rufen helloworld.faehigkeit(…) / helloworld.ki(…) auf ----------
addEventListener('message', async (ev) => {
  const d = ev.data;
  if (!d || !['faehigkeit', 'ki'].includes(d.hwSdk)) return;
  const t = tabs.find((x) => x.rahmen && x.rahmen.contentWindow === ev.source);
  if (!t) return;
  const antworten = (x) => t.rahmen.contentWindow.postMessage({ hwAntwort: true, id: d.id, ...x }, '*');
  if (STATISCH) return antworten({ ok: false, fehler: d.hwSdk === 'ki' ? 'Diese App rechnet mit deiner KI – das geht im Hello-World-Programm am PC.' : 'Das steuert deinen Computer und geht im Hello-World-Programm am PC.' });
  if (d.hwSdk === 'ki') {
    const q = t.art === 'vorschau' ? { auftrag: t.auftrag, kennung: t.titel, adresse: `/api/bau/${t.auftrag}/vorschau` }
      : t.vorschau ? { auftrag: t.vorschau.id, kennung: t.kennung, adresse: `/api/bau/${t.vorschau.id}/vorschau` }
      : { slug: t.slug, version: t.version, kennung: t.kennung, adresse: quelle(t) };
    try { antworten({ ok: true, ergebnis: await appKiAusfuehren(q, String(d.aufgabe), d.eingabe ?? {}) }); }
    catch (err) { antworten({ ok: false, fehler: err.message }); }
    return;
  }
  try { antworten({ ok: true, ergebnis: await faehigkeitAusfuehren(t.app, String(d.name), d.parameter || {}) }); }
  catch (err) { antworten({ ok: false, fehler: err.message }); }
});

// ---------- Start ----------
(async () => {
  if (!STATISCH) await ichLaden().catch(() => {});
  const s = await (await fetch('/api/apps', { cache: 'no-store' })).json();
  katalog = s.apps || [];
  if (!kiEinstellung() && s.lokaleKi) localStorage.setItem('hw-ki', JSON.stringify({ art: 'lokal', programm: s.kiProgramme?.[0]?.id }));
  const start = startName ? await appHolen(startName) : null;
  if (startName && !start) { document.body.innerHTML = '<main class="seite"><h1 class="hw-titel" style="margin-top:40px">Nicht gefunden</h1><p><a href="/">Zurück zu Hello World</a></p></main>'; return; }
  // Gespeicherte Tabs wiederherstellen (ohne sie schon zu laden – erst beim Antippen)
  for (const g of tabsLaden()) {
    const a = await appHolen(g.slug);
    if (a && ['browser', 'design'].includes(a.typ || 'browser')) tabs.push({ art: 'app', kennung: kennung(a), slug: a.slug, version: g.version || null, app: a, titel: kennung(a) + (g.version ? '@' + g.version : '') });
  }
  const q = new URLSearchParams(location.search);
  if (start && !['browser', 'design'].includes(start.typ || 'browser')) infoseite(start);
  else if (start) await oeffnen(startName, { neu: q.has('neu') || q.has('erweitert') });
  else if (tabs.length) tabZeigen(0);
  else location.href = '/';
  const sc = document.createElement('script'); sc.src = '/chat.js'; document.body.appendChild(sc);
  if (q.has('neu') || q.has('erweitert') || q.has('weiter')) sc.onload = () => window.hwChat.oeffnen();
})();
</script>
</body>
</html>
